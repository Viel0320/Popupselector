name: Publish to Maven Central

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      target:
        description: 'Publish target (use github-packages to backfill/skip Maven Central)'
        type: choice
        default: all
        options:
          - all
          - central
          - github-packages

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build & Publish to Maven Central
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run Tests & Checks
        run: ./gradlew :popupselector:check --no-daemon



      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_SECRET_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -z "$ORG_GRADLE_PROJECT_mavenCentralUsername" ] || [ -z "$ORG_GRADLE_PROJECT_signingInMemoryKey" ]; then
            echo "::error::Required secrets (MAVEN_CENTRAL_USERNAME or SIGNING_SECRET_KEY) are missing."
            exit 1
          fi

          # The Gradle signing plugin fails with an opaque "Could not read PGP secret key"
          # when the secret content is malformed. Fail early with an actionable message.
          # Only the armor header and line count are printed - never key material.
          first_line=$(printf '%s' "$ORG_GRADLE_PROJECT_signingInMemoryKey" | head -n 1 | tr -d '\r')
          key_lines=$(printf '%s' "$ORG_GRADLE_PROJECT_signingInMemoryKey" | wc -l)
          if [ "$first_line" != "-----BEGIN PGP PRIVATE KEY BLOCK-----" ]; then
            echo "::error::SIGNING_SECRET_KEY is not an ASCII-armored PGP private key."
            echo "::error::First line was: '${first_line:-<empty>}' (total lines: ${key_lines})."
            echo "::error::Re-export with: gpg --armor --export-secret-keys <KEYID>, then paste the entire block including the BEGIN/END lines."
            exit 1
          fi

          echo "Publishing and releasing artifacts to Maven Central..."
          ./gradlew publishAndReleaseToMavenCentral --no-daemon --no-configuration-cache
        if: inputs.target != 'github-packages'

      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Publishing artifacts to GitHub Packages..."
          ./gradlew publishAllPublicationsToGitHubPackagesRepository --no-daemon --no-configuration-cache
        if: inputs.target != 'central'
